; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = alphapi

[env:alphapi]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; 崩溃时把地址解析成函数名+行号
monitor_filters = esp32_exception_decoder
upload_speed = 115200
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_qspi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.cmake_extra_args = -Wno-dev
build_unflags = -std=gnu++11
build_flags = 
	-std=gnu++17
	-DBOARD_HAS_PSRAM
	; 板子用的是 HETAO/N32 USB-串口桥（2F4E:0102），不是原生 USB，
	; 所以 Serial 必须走 UART0（GPIO43/44），不能开 CDC_ON_BOOT
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DCORE_DEBUG_LEVEL=3
	-DLV_CONF_INCLUDE_SIMPLE
	-Iinclude
	-DPIN_LCD_MOSI=35
	-DPIN_LCD_SCK=37
	-DPIN_LCD_MISO=38
	-DPIN_LCD_CS=33
	-DPIN_LCD_DC=36
	-DPIN_LCD_RST=10
	-DPIN_LCD_BL=11
	-DLCD_H_RES=160
	-DLCD_V_RES=128
	-DLCD_SPI_HZ=40000000
	-DLCD_INVERT=1
	-DLCD_BL_ACTIVE_LOW=0
	-DLCD_BL_USE_PWM=1
	-DLCD_X_OFFSET=0
	-DLCD_Y_OFFSET=0
	-DPIN_N32_TX=3
	-DPIN_N32_RX=0
	-DN32_BAUD=1000000
lib_deps = 
; lvgl 已精简后拷到 lib/lvgl（只留 src + 头文件，235MB -> 24MB），
; lib/ 下的库会被自动编译，不要再写 lib_deps，否则会重复链接。
	bitbank2/JPEGDEC
	unit-electronics-mx/DevLab_LibHelix@^0.9.4
; chain+ 只从工程源码沿 include 链走，不再遍历 LVGL 那 235MB 的整棵树。
; 注意：不要改成 off —— 在 espressif32 平台上 off 会让 Arduino framework 的
; include 目录进不了编译命令，连 WiFi.h/LittleFS.h 都找不到。
lib_ldf_mode = chain+
lib_compat_mode = off
