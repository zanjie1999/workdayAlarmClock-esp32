; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = alphapi

[env:alphapi]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; 崩溃时把地址解析成函数名+行号
monitor_filters = esp32_exception_decoder
upload_speed = 115200
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_qspi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.cmake_extra_args = -Wno-dev
build_unflags = -std=gnu++11
; src/headless/ 是 AlphaPi 微控制器（C3）专用的 headless 模块，S3 构建不参与
build_src_filter =
	+<*>
	-<headless/>
build_flags = 
	-std=gnu++17
	-DBOARD_HAS_PSRAM
	; 板子用的是 HETAO/N32 USB-串口桥（2F4E:0102），不是原生 USB，
	; 所以 Serial 必须走 UART0（GPIO43/44），不能开 CDC_ON_BOOT
	-DARDUINO_USB_CDC_ON_BOOT=0
	; 双核分工：核 0 = 系统(WiFi/lwIP 固定核 0) + LVGL + 80 口 httpd(含 neapi 代理) + 8080
	;           核 1 = 音频链(player_ctl/player_io/pcm_out/alarm)。
	; 这两个宏把 loopTask(LVGL) 和 arduino_events 任务钉到核 0（sdkconfig 默认都在核 1）
	-DARDUINO_RUNNING_CORE=0
	-DARDUINO_EVENT_RUNNING_CORE=0
	-DCORE_DEBUG_LEVEL=3
	-DLV_CONF_INCLUDE_SIMPLE
	-Iinclude
	; ✅ v5 手册 §2.2 实测锁定：SCK=41 MOSI=42 MISO=47 CS=38 DC=40 RST=39 BL=37
	-DPIN_LCD_MOSI=42
	-DPIN_LCD_SCK=41
	-DPIN_LCD_MISO=47
	-DPIN_LCD_CS=38
	-DPIN_LCD_DC=40
	-DPIN_LCD_RST=39
	-DPIN_LCD_BL=37
	-DLCD_H_RES=160
	-DLCD_V_RES=128
	; ✅ 参考工程（alphapi_one_xiaozhi_car_radio）实测 31.25MHz
	-DLCD_SPI_HZ=31250000
	; ✅ 参考工程实测：这块屏不需要反相
	-DLCD_INVERT=0
	-DLCD_X_OFFSET=0
	-DLCD_Y_OFFSET=0
	-DPIN_N32_TX=3
	-DPIN_N32_RX=0
	; ✅ 参考工程实机实测：N32 固定 460800（1Mbps 完全静默），不探测
	-DN32_BAUD=460800
lib_deps =
; lvgl 已精简后拷到 lib/lvgl（只留 src + 头文件，235MB -> 24MB），
; lib/ 下的库会被自动编译，不要再写 lib_deps，否则会重复链接。
	bitbank2/JPEGDEC
	unit-electronics-mx/DevLab_LibHelix@^0.9.4
; chain+ 只从工程源码沿 include 链走，不再遍历 LVGL 那 235MB 的整棵树。
; 注意：不要改成 off —— 在 espressif32 平台上 off 会让 Arduino framework 的
; include 目录进不了编译命令，连 WiFi.h/LittleFS.h 都找不到。
lib_ldf_mode = chain+
lib_compat_mode = off

[env:alphapi-c3]
; AlphaPi 微控制器（手表形态，ESP32-C3 4MB）：无屏 headless + 5x5 LED 点阵 + GPIO 按键。
; 音频走板上 N32 协处理器（协议与 One 完全一致，只是 UART 引脚不同），80/8080 web 全保留。
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; HETAO 桥实测只支持 115200
upload_speed = 115200
board_build.partitions = partitions_c3.csv
board_build.filesystem = littlefs
build_unflags = -std=gnu++11
; 排除屏幕/LVGL/UI/JPEG（无屏），其余（app/net/web/audio/cmd）全保留
build_src_filter =
	+<*>
	-<ui_port/>
	-<display_st7789.cpp>
	-<net/mjpeg.cpp>
; LVGL 在 lib/ 下会被自动编译，headless 用不到
lib_ignore = lvgl
build_flags =
	-std=gnu++17
	-DWAC_HEADLESS=1
	-DCORE_DEBUG_LEVEL=3
	-Iinclude
	; ---- 日志重定向：USB 口在 N32 上，C3 没有直连 PC 的串口，UART0（GPIO21/20）
	; 又兼作按键/桥下载通道不能占用。Serial 输出全部拦截进环形缓冲，80 端口 GET /log 查看。
	; 三件套缺一不可：强制注入声明 / 改写 Serial / 干掉 HardwareSerial.h 的全局 extern
	-DNO_GLOBAL_SERIAL
	-DSerial=WacLog
	-include src/headless/weblog.h
	; ---- N32 协处理器（协议与 One 相同，引脚来自原厂逆向资料）
	-DPIN_N32_TX=8
	-DPIN_N32_RX=9
	-DN32_BAUD=460800
	; ---- GPIO 按键（实测定案：下拉、按下=高；20/21 是控制台串口不是按键）
	-DPIN_KEY_VOLDOWN=10
	-DPIN_KEY_PLAY=1
	-DPIN_KEY_VOLUP=3
lib_deps =
	unit-electronics-mx/DevLab_LibHelix@^0.9.4
lib_ldf_mode = chain+
lib_compat_mode = off
